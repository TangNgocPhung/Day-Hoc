 hàng; nhập <code>tenNhacsi<\/code>, rồi xác nhận để lưu. Trong mô phỏng, dùng <b>Thêm dòng → Lưu dữ liệu<\/b>.", "tip": "<code>idNhacsi<\/code> có kiểu INT, AUTO_INCREMENT nên không cần tự nhập mã. Mã mới không nhất thiết nối liền các mã đang hiển thị nếu đã có dòng bị xóa.", "visual": "<div class=\"eyebrow\">Dòng sắp thêm<\/div><div class=\"concept-table\" style=\"margin-top:12px\"><p><code>idNhacsi<\/code> → tự tăng<\/p><p style=\"margin:0\"><code>tenNhacsi<\/code> → Trịnh Công Sơn<\/p><\/div><p class=\"subtitle muted\" style=\"margin:15px 0 0\">Nhập nội dung → Lưu → Có thêm một dòng.<\/p>"}, {"title": "Sửa dữ liệu", "tag": "UPDATE / đúng ô cần sửa", "body": "Nháy đúp vào ô có dữ liệu cần sửa trong HeidiSQL, nhập nội dung đúng và xác nhận. Với mô phỏng, nháy đúp dòng hoặc dùng nút <b>Sửa<\/b>, rồi lưu biểu mẫu.", "tip": "Sửa tên không cần đổi khóa chính. Luôn kiểm tra chính xác dòng đang được chọn trước khi lưu.", "visual": "<div class=\"concept-table\"><p><span class=\"muted\">Trước:<\/span> <s>Hoang Việt<\/s><\/p><p style=\"margin:0\"><span class=\"accent\">Sau:<\/span> <b>Hoàng Việt<\/b><\/p><\/div><div class=\"note\">idNhacsi = 3 được giữ nguyên.<\/div>"}, {"title": "Xóa dữ liệu", "tag": "DELETE / có xác nhận", "body": "Chọn các dòng cần xóa. Trong HeidiSQL có thể dùng Shift cho các dòng liền nhau, Ctrl cho các dòng cách nhau, rồi Ctrl+Delete hoặc biểu tượng xóa. Xem lại thông báo trước khi chọn OK. Trong mô phỏng, tích ô chọn và nhấn <b>Xóa đã chọn<\/b>.", "tip": "Nút Hủy đóng hộp thoại mà không xóa dữ liệu. Với bảng có tham chiếu, việc xóa còn phải thỏa ràng buộc khóa ngoại ở Bài 22.", "visual": "<div class=\"concept-table\"><h3>Xóa 2 dòng đã chọn?<\/h3><p class=\"muted\">Xem lại tên bảng, số dòng và dữ liệu trước khi xác nhận.<\/p><span class=\"pill\">Có thể hủy trước khi thực hiện<\/span><\/div>"}, {"title": "Lọc & sắp xếp", "tag": "READ / xem đúng dữ liệu", "body": "Chọn bảng và thẻ Dữ liệu để xem. Nhấn tiêu đề cột để đổi thứ tự tăng/giảm. Trong HeidiSQL, Quick Filter với LIKE giúp tìm theo mẫu; ở đây dùng ô <b>Lọc theo tên<\/b> để tìm chuỗi con.", "tip": "<code>LIKE '%P%'<\/code> tìm tên có chứa P; <code>LIKE 'P%'<\/code> tìm tên bắt đầu bằng P. Bỏ lọc sẽ hiển thị lại các dòng.", "visual": "<div class=\"concept-table\"><p><code>%P%<\/code> → chứa P<\/p><p><code>P%<\/code> → bắt đầu bằng P<\/p><p style=\"margin:0\"><code>ORDER BY idNhacsi DESC<\/code><br><span class=\"muted\">Mã lớn đứng trước.<\/span><\/p><\/div>"}, {"title": "Truy vấn SQL", "tag": "SELECT / câu lệnh đọc dữ liệu", "body": "Mở thẻ Truy vấn trong HeidiSQL, viết SELECT rồi thực hiện. SELECT cho biết các trường cần lấy; FROM xác định bảng; WHERE lọc dòng; ORDER BY sắp xếp kết quả.", "tip": "Dấu * lấy mọi trường. ASC là tăng dần (mặc định), DESC là giảm dần. Có thể kết hợp điều kiện bằng AND, OR và ngoặc đơn.", "visual": "<pre class=\"concept-table\">SELECT idNhacsi, tenNhacsi\nFROM nhacsi\nWHERE tenNhacsi LIKE 'P%'\nORDER BY tenNhacsi ASC;<\/pre>"}], "coreNote": "Cập nhật dữ liệu gồm thêm, sửa, xóa. Truy xuất gồm xem, lọc, sắp xếp và lấy dữ liệu theo yêu cầu. Trong phần SQL của bài học chỉ mô phỏng câu lệnh SELECT.", "schemas": {"nhacsi": {"key": "idNhacsi", "name": "tenNhacsi", "label": "Nhạc sĩ", "fields": ["idNhacsi", "tenNhacsi"], "note": "Nhấp đúp dòng để sửa. Khóa chính tự tăng; xóa một dòng không làm các mã còn lại tự đổi số."}, "casi": {"key": "idCasi", "name": "tenCasi", "label": "Ca sĩ", "fields": ["idCasi", "tenCasi"], "note": "Luyện tập tương tự bảng nhacsi: thêm ca sĩ, sửa tên, lọc và truy vấn theo các tiêu chí."}, "tinhthanh": {"key": "idTinhThanh", "name": "tenTinhThanh", "label": "Tỉnh / thành phố (giả định)", "fields": ["idTinhThanh", "tenTinhThanh"], "note": "Tỉnh A, Thành phố B là dữ liệu giả định để luyện tập, không phải danh mục hành chính thực tế."}}, "initial": {"nhacsi": [{"idNhacsi": 1, "tenNhacsi": "Đỗ Nhuận"}, {"idNhacsi": 2, "tenNhacsi": "Văn Cao"}, {"idNhacsi": 3, "tenNhacsi": "Hoang Việt"}, {"idNhacsi": 4, "tenNhacsi": "Nguyễn Tài Tuệ"}, {"idNhacsi": 5, "tenNhacsi": "Nguyễn Văn Tý"}, {"idNhacsi": 6, "tenNhacsi": "Phan Nhân"}, {"idNhacsi": 7, "tenNhacsi": "Phan Huỳnh Điểu"}], "casi": [{"idCasi": 1, "tenCasi": "Anh Thơ"}, {"idCasi": 2, "tenCasi": "Trọng Tấn"}, {"idCasi": 3, "tenCasi": "Tân Nhàn"}], "tinhthanh": [{"idTinhThanh": 1, "tenTinhThanh": "Tỉnh A"}, {"idTinhThanh": 2, "tenTinhThanh": "Thành phố B"}]}, "tasks": [{"id": "add", "short": "Thêm một nhạc sĩ", "text": "Thêm tên <b>Trịnh Công Sơn<\/b> vào bảng nhacsi.", "hint": "Chọn nhacsi → Thêm dòng → nhập tenNhacsi → Lưu. Không nhập idNhacsi."}, {"id": "edit", "short": "Sửa tên bị thiếu dấu", "text": "Sửa dòng mã <b>3<\/b>: “Hoang Việt” thành <b>Hoàng Việt<\/b>.", "hint": "Nhấn Sửa ở dòng idNhacsi = 3, sửa đúng tên rồi lưu."}, {"id": "delete", "short": "Thực hành xóa an toàn", "text": "Thêm dòng có tên <b>Nhạc sĩ thử<\/b>, sau đó chọn và xóa chính dòng ấy.", "hint": "Tạo dòng thử, tích ô ở đầu dòng → Xóa đã chọn → xác nhận. Có thể bỏ lọc để tìm dòng vừa thêm."}, {"id": "filter", "short": "Tìm tên có chữ P", "text": "Nhập <b>P<\/b> vào ô lọc của bảng nhacsi.", "hint": "Bộ lọc ở đây tìm chuỗi con, tương tự LIKE '%P%'. Hai dòng mẫu phù hợp là Phan Nhân và Phan Huỳnh Điểu."}, {"id": "sort", "short": "Sắp xếp mã giảm dần", "text": "Ở bảng nhacsi, đổi cột <b>idNhacsi<\/b> sang thứ tự <b>↓<\/b>.", "hint": "Nhấp tiêu đề idNhacsi; nếu mũi tên đang ↑, nhấp lần nữa để chuyển sang ↓."}, {"id": "sql", "short": "Chạy SELECT theo yêu cầu", "text": "Lấy mã, tên nhạc sĩ bắt đầu bằng <b>P<\/b>; sắp xếp tên tăng dần.", "hint": "SELECT idNhacsi, tenNhacsi FROM nhacsi WHERE tenNhacsi LIKE 'P%' ORDER BY tenNhacsi ASC;"}], "sqlExamples": [{"label": "Tất cả nhạc sĩ", "sql": "SELECT *\nFROM nhacsi;"}, {"label": "Tên chứa P", "sql": "SELECT idNhacsi, tenNhacsi\nFROM nhacsi\nWHERE tenNhacsi LIKE '%P%';"}, {"label": "Bắt đầu P · tên tăng dần", "sql": "SELECT idNhacsi, tenNhacsi\nFROM nhacsi\nWHERE tenNhacsi LIKE 'P%'\nORDER BY tenNhacsi ASC;"}, {"label": "Mã giảm dần", "sql": "SELECT * FROM nhacsi\nORDER BY idNhacsi DESC;"}, {"label": "AND / OR", "sql": "SELECT * FROM nhacsi\nWHERE tenNhacsi LIKE 'P%' AND (idNhacsi = 6 OR idNhacsi = 7)\nORDER BY tenNhacsi ASC;"}, {"label": "Luyện tập bảng casi", "sql": "SELECT * FROM casi\nORDER BY tenCasi ASC;"}], "quiz": [{"q": "Với trường INT AUTO_INCREMENT, khi thêm dòng em thường cần làm gì?", "options": ["Tự chọn một mã trùng với dòng trước.", "Để hệ QTCSDL tự tạo mã, nhập các trường dữ liệu cần thiết.", "Xóa trường khóa chính.", "Nhập lại toàn bộ mã của bảng."], "answer": 1, "explain": "AUTO_INCREMENT sinh mã tự động. Trong mô phỏng trường mã không nhập bằng tay."}, {"q": "Tên nhạc sĩ bị sai một kí tự, thao tác phù hợp là gì?", "options": ["Sửa đúng trường tên ở dòng đó.", "Xóa cả cơ sở dữ liệu.", "Đổi tất cả khóa chính.", "Chỉ sắp xếp lại bảng."], "answer": 0, "explain": "Cập nhật đúng ô sai giúp giữ nguyên định danh và các dữ liệu khác."}, {"q": "Khi hộp thoại xóa xuất hiện nhưng chưa chắc chắn, em nên chọn gì?", "options": ["OK để thử xem.", "Đóng toàn bộ máy tính.", "Hủy / Cancel để kiểm tra lại.", "Nhập thêm một dòng khác."], "answer": 2, "explain": "Hủy trước khi xác nhận sẽ không thực hiện thao tác xóa."}, {"q": "Mẫu LIKE nào tìm tên chứa chữ P ở vị trí bất kì?", "options": ["LIKE 'P%'", "LIKE '%P'", "LIKE 'P'", "LIKE '%P%'"], "answer": 3, "explain": "Hai dấu % cho phép có chuỗi bất kì trước và sau P."}, {"q": "ORDER BY idNhacsi DESC có ý nghĩa gì?", "options": ["Tăng dần theo tên.", "Giảm dần theo mã nhạc sĩ.", "Xóa những mã lớn.", "Đổi giá trị các mã."], "answer": 1, "explain": "DESC sắp xếp giảm dần; chỉ thứ tự kết quả thay đổi, giá trị mã không đổi."}, {"q": "Trong SELECT * FROM nhacsi, dấu * có nghĩa là gì?", "options": ["Chỉ lấy khóa chính.", "Chỉ lấy dòng đầu tiên.", "Lấy tất cả các trường của bảng.", "Xóa mọi trường."], "answer": 2, "explain": "Dấu * thay cho danh sách tất cả các cột; không phải thao tác xóa."}, {"q": "Thành phần nào giới hạn các dòng được trả về?", "options": ["WHERE", "FROM", "ORDER BY", "ASC"], "answer": 0, "explain": "WHERE xác định điều kiện mà các dòng kết quả phải thỏa mãn."}, {"q": "Phát biểu nào đúng khi bỏ bộ lọc đang áp dụng?", "options": ["Những dòng bị ẩn trước đó đã bị xóa.", "Mọi tên được đổi thành chữ P.", "Khóa chính được đánh số lại.", "Các dòng không thỏa bộ lọc được hiển thị trở lại."], "answer": 3, "explain": "Lọc chỉ quyết định dữ liệu hiển thị; không xóa dữ liệu gốc."}], "transfer": {"description": "Chuyển những thao tác vừa học sang bảng tỉnh / thành phố và giải thích lựa chọn của em.", "title": "Tìm đúng thông tin cần xem", "body": "<p>Bảng <code>tinhthanh(idTinhThanh, tenTinhThanh)<\/code> đang có Tỉnh A và Thành phố B. Cần thêm “Tỉnh C” rồi xem danh sách tên tăng dần.<\/p><p>Nên thực hiện theo cách nào?<\/p>", "options": ["Thêm dòng mới, rồi truy vấn ORDER BY tenTinhThanh ASC.", "Đổi id của Tỉnh A thành tên Tỉnh C.", "Xóa hết bảng trước khi sắp xếp."], "answer": 0, "explain": "Tên mới là một dòng mới. Sắp xếp bằng ORDER BY tenTinhThanh ASC không làm đổi các mã định danh."}, "extension": {"title": "Luyện tập bảng casi & tinhthanh", "steps": ["Trong phòng thực hành, chọn <b>casi<\/b>; thêm ca sĩ <b>Hồng Nhung<\/b>, thử sửa tên và lọc theo chữ H.", "Viết truy vấn lấy mã, tên ca sĩ theo thứ tự tên tăng dần.", "Chọn <b>tinhthanh<\/b>; thêm <b>Tỉnh C<\/b>, sau đó truy vấn danh sách tên tăng dần.", "Ghi lại sự khác biệt giữa thay đổi dữ liệu và thay đổi cách hiển thị dữ liệu."], "note": "Các bài mở rộng được tự thực hành và để giáo viên nhận xét; không cộng vào 6 nhiệm vụ bắt buộc. Có thể dùng JSON để gửi lại dữ liệu và truy vấn đã làm.", "answer": "SELECT idCasi, tenCasi FROM casi ORDER BY tenCasi ASC;<br>SELECT * FROM tinhthanh ORDER BY tenTinhThanh ASC;"}};</script><script id="lesson-engine">'use strict';
function makeDB(tables, initial, sequences) {
  const data = JSON.parse(JSON.stringify(initial));
  const seq = Object.fromEntries(Object.keys(tables).map(t=>[t, Math.max(0, ...(data[t]||[]).map(r=>r[tables[t].key]), (sequences||{})[t]||0)]));
  function schema(t){if(!tables[t])throw Error('Không có bảng “'+t+'”.');return tables[t];}
  function validate(t, row){
    const s=schema(t);
    for(const f of s.fields){
      if(f===s.key)continue;
      const fk=(s.foreign||{})[f];
      if(fk){
        const n=Number(row[f]);
        if(!Number.isInteger(n)||n<=0||!data[fk.table].some(r=>r[fk.key]===n))throw Error('Khóa ngoại '+f+' = '+String(row[f]||'trống')+' không hợp lệ. Hãy chọn một giá trị đã có trong '+fk.table+'.'+fk.key+'.');
        row[f]=n;
      }else{
        row[f]=String(row[f]??'').trim();
        if(!row[f])throw Error('Không được bỏ trống '+f+'.');
        if(row[f].length>100)throw Error(f+' chỉ nhận tối đa 100 kí tự trong mô phỏng.');
      }
    }
    return Object.fromEntries(s.fields.map(f=>[f,row[f]]));
  }
  function insert(t, values){const s=schema(t), row=validate(t,{...values,[s.key]:seq[t]+1});seq[t]++;data[t].push(row);return row;}
  function update(t,id,values){const s=schema(t), i=data[t].findIndex(r=>r[s.key]===Number(id));if(i<0)throw Error('Dòng dữ liệu không còn tồn tại.');const row=validate(t,{...data[t][i],...values,[s.key]:Number(id)});data[t][i]=row;return row;}
  function remove(t,ids){
    const s=schema(t), targets=new Set(ids.map(Number));
    if(!targets.size)throw Error('Hãy chọn ít nhất một dòng để xóa.');
    for(const [child,cs] of Object.entries(tables))for(const [f,fk] of Object.entries(cs.foreign||{})){
      if(fk.table===t){const refs=data[child].filter(r=>targets.has(r[f]));if(refs.length)throw Error('Không thể xóa: '+child+' đang có '+refs.length+' dòng tham chiếu đến dữ liệu đã chọn qua '+f+'. Hãy xử lí dữ liệu liên quan trước. Mô phỏng dùng ON DELETE RESTRICT, không xóa dây chuyền.');}
    }
    const deleted=data[t].filter(r=>targets.has(r[s.key]));data[t]=data[t].filter(r=>!targets.has(r[s.key]));return deleted;
  }
  function query(sql){return runSelect(sql,tables,data);}
  return {data,seq,insert,update,remove,query};
}
function runSelect(sql,tables,data){
  const tokens=[];let i=0;
  while(i<sql.length){
    const c=sql[i];if(/\s/.test(c)){i++;continue;}
    if(c==="'"){let v='',closed=false;i++;while(i<sql.length){if(sql[i]==="'"){if(sql[i+1]==="'"){v+="'";i+=2;continue;}i++;closed=true;break;}v+=sql[i++];}if(!closed)throw Error('Chuỗi chưa đóng dấu nháy đơn.');tokens.push({type:'string',v});continue;}
    if(c==='`'){let j=sql.indexOf('`',i+1);if(j<0)throw Error('Thiếu dấu ` đóng tên trường.');tokens.push({type:'word',v:sql.slice(i+1,j)});i=j+1;continue;}
    const num=sql.slice(i).match(/^\d+/);if(num){tokens.push({type:'number',v:Number(num[0])});i+=num[0].length;continue;}
    const word=sql.slice(i).match(/^[A-Za-z_][A-Za-z_0-9]*/);if(word){tokens.push({type:'word',v:word[0]});i+=word[0].length;continue;}
    if('*,.=();'.includes(c)){tokens.push({type:'symbol',v:c});i++;continue;}
    throw Error('Kí tự chưa được hỗ trợ: '+c+'. Dùng SELECT, WHERE (= / LIKE, AND / OR) và ORDER BY.');
  }
  let p=0;
  const peek=x=>tokens[p]&&String(tokens[p].v).toUpperCase()===x;
  const eat=x=>{if(peek(x)){p++;return true;}return false;};
  const need=x=>{if(!eat(x))throw Error('Cần '+x+' tại vị trí '+(p+1)+' của câu lệnh.');};
  const identifier=()=>{const t=tokens[p++];if(!t||t.type!=='word')throw Error('Cần tên bảng hoặc tên trường hợp lệ.');return t.v;};
  need('SELECT');let columns=[];
  if(eat('*'))columns=['*'];else{columns.push(identifier());while(eat(','))columns.push(identifier());}
  need('FROM');let table=identifier();if(eat('.')){if(table.toLowerCase()!=='mymusic')throw Error('Mô phỏng chỉ có CSDL mymusic.');table=identifier();}
  table=Object.keys(tables).find(t=>t.toLowerCase()===table.toLowerCase());if(!table)throw Error('Không tìm thấy bảng. Xem danh sách bảng trong phòng thực hành.');
  const fields=tables[table].fields;
  function field(x){const f=fields.find(f=>f.toLowerCase()===x.toLowerCase());if(!f)throw Error('Bảng '+table+' không có trường '+x+'.');return f;}
  columns=columns[0]==='*'?[...fields]:columns.map(field);
  function atom(){
    if(eat('(')){const n=or();need(')');return n;}
    const f=field(identifier());let op;if(eat('='))op='=';else if(eat('LIKE'))op='LIKE';else throw Error('Điều kiện cần toán tử = hoặc LIKE.');
    const t=tokens[p++];if(!t||!['string','number'].includes(t.type))throw Error('Giá trị văn bản phải nằm trong nháy đơn; số có thể viết trực tiếp.');
    if(op==='LIKE'&&t.type!=='string')throw Error('Mẫu LIKE phải là chuỗi trong nháy đơn.');
    return {op,f,value:t.v};
  }
  function and(){let n=atom();while(eat('AND'))n={op:'AND',a:n,b:atom()};return n;}
  function or(){let n=and();while(eat('OR'))n={op:'OR',a:n,b:and()};return n;}
  let where=null;if(eat('WHERE'))where=or();
  const order=[];
  if(eat('ORDER')){need('BY');do{const f=field(identifier());let dir='ASC';if(eat('DESC'))dir='DESC';else eat('ASC');order.push({f,dir});}while(eat(','));}
  eat(';');if(p!==tokens.length)throw Error('Phần câu lệnh chưa hỗ trợ hoặc dư nội dung: '+String(tokens[p].v)+'. Chỉ chạy một SELECT mỗi lần; chưa hỗ trợ JOIN, LIMIT hay lệnh cập nhật.');
  function test(n,row){
    if(!n)return true;if(n.op==='AND')return test(n.a,row)&&test(n.b,row);if(n.op==='OR')return test(n.a,row)||test(n.b,row);
    if(n.op==='=')return typeof row[n.f]==='number'?row[n.f]===Number(n.value):String(row[n.f]).toLocaleLowerCase('vi')===String(n.value).toLocaleLowerCase('vi');
    const pat=Array.from(String(n.value)).map(c=>c==='%'?'.*':c==='_'?'.':c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('');
    return new RegExp('^'+pat+'$','iu').test(String(row[n.f]));
  }
  const rows=data[table].filter(r=>test(where,r)).map(r=>({...r}));
  rows.sort((a,b)=>{for(const x of order){const cmp=typeof a[x.f]==='number'?a[x.f]-b[x.f]:String(a[x.f]).localeCompare(String(b[x.f]),'vi');if(cmp)return x.dir==='DESC'?-cmp:cmp;}return 0;});
  return {table,columns,where,order,rows:rows.map(r=>Object.fromEntries(columns.map(f=>[f,r[f]])))};
}
globalThis.LessonEngine={makeDB,runSelect};
</script><script id="lesson-app">'use strict';
const $=id=>document.getElementById(id);

let cached=null,canSave=true;try{cached=JSON.parse(localStorage.getItem(KEY));if(cached&&cached.version!==1)cached=null;}catch(e){canSave=false;}
let s={version:1,achievements:{},answers:{},quizSubmitted:false,starter:null,concept:0,name:'',className:'',reflection:'',transfer:null,tempIds:[],actions:[],queries:[],...cached};

let db;try{db=LessonEngine.makeDB(C.schemas,cached?.data||C.initial,cached?.seq);}catch(e){db=LessonEngine.makeDB(C.schemas,C.initial);}
let table=C.defaultTable,filter='',sort={f:C.schemas[table].key,dir:'ASC'},selected=new Set(),editing=null,activeTab='start',sqlResult=null,sqlError='',toastTimer;

function percent(){const n=Object.keys(s.achievements).filter(id=>C.tasks.some(t=>t.id===id)).length;return Math.round((n+Number(s.quizSubmitted)+Number(s.starter!==null)+Number(s.transfer!==null))/(C.tasks.length+3)*100);}

function switchTab(id){activeTab=id;for(const [t] of tabs){$('panel-'+t).hidden=t!==id;const b=$('tab-'+t);b.classList.toggle('active',t===id);b.setAttribute('aria-selected',String(t===id));}if(id==='transfer')renderReport();if(id==='lab'){renderLab();}location.hash=id;}

function renderStart(){
  $('panel-start').innerHTML=head('01 / Bắt đầu từ tình huống','Em sẽ xử lí thế nào?','Chọn một phương án, rồi giải thích lựa chọn của mình.')+'<div class="grid2"><div class="card"><span class="pill">Tình huống mở đầu</span><p class="lead" style="margin-top:20px">'+C.starter.question+'</p><div class="options">'+C.starter.options.map((x,i)=>'<button data-action="starter" data-index="'+i+'"><span class="opt-num">'+String.fromCharCode(65+i)+'</span><span>'+x+'</span></button>').join('')+'</div><div id="starterFeedback" role="status"></div></div><div class="card dark"><div class="eyebrow" style="color:#b4e7d3">Đích đến của bài học</div><h2 style="margin-top:12px">'+C.goalTitle+'</h2><ul class="steps-list">'+C.goals.map((g,i)=>'<li><span class="step-mark" style="color:#b4e7d3">0'+(i+1)+'</span><span>'+g+'</span></li>').join('')+'</ul><button class="primary" data-action="go" data-tab="explore">Bắt đầu khám phá →</button></div></div><details class="teacher"><summary>Gợi ý tổ chức 2 tiết học & cách sử dụng</summary><ol><li><b>Tiết 1:</b> Khởi động 5 phút → Khám phá 10 phút → Thực hành có hướng dẫn 25 phút → Chốt kiến thức 5 phút.</li><li><b>Tiết 2:</b> Ôn lại 5 phút → Hoàn thành nhiệm vụ và SQL 20 phút → Luyện tập 10 phút → Vận dụng, báo cáo 10 phút.</li><li>Mỗi học sinh/nhóm thao tác trên máy riêng; nhập họ tên, lớp ở phần Vận dụng để in phiếu kết quả. Dữ liệu mẫu chỉ dùng học tập và có thể khôi phục.</li><li>File hoạt động ngoại tuyến. Tiến độ lưu trên trình duyệt nếu trình duyệt cho phép lưu; mỗi file có bộ dữ liệu riêng. Khi dùng chung một máy, chọn <b>Làm lại toàn bộ</b> trước lượt học sinh tiếp theo.</li><li>Nội dung bám Bài '+C.lesson+', trang '+C.pages+' từ ảnh SGK được cung cấp. Đây là mô phỏng học tập; khi chuyển sang HeidiSQL, dùng thao tác tương ứng trong sách.</li></ol></details>';
  showStarter();
}
function showStarter(){if(s.starter===null)return;const ok=s.starter===C.starter.answer;$('starterFeedback').className='feedback '+(ok?'success':'error');$('starterFeedback').innerHTML='<b>'+(ok?'Lựa chọn hợp lí.':'Hãy xem lại tình huống.')+'</b> '+C.starter.explain;}
function renderExplore(){
  $('panel-explore').innerHTML=head('02 / Hiểu trước khi thao tác',C.exploreTitle,'Nhấn từng thẻ để xem cách làm, ý nghĩa và lỗi cần tránh.')+'<div class="path">'+C.concepts.map((x,i)=>'<button data-action="concept" data-index="'+i+'" class="'+(s.concept===i?'active':'')+'">'+(i+1)+'. '+x.title+'</button>').join('')+'</div><div id="conceptBody" class="card concept-body"></div><div class="note">'+C.coreNote+'</div><div style="margin-top:20px"><button class="primary" data-action="go" data-tab="lab">Mở phòng thực hành →</button></div>';
  showConcept();
}
function showConcept(){const c=C.concepts[s.concept]||C.concepts[0];$('conceptBody').innerHTML='<div class="grid2"><div><span class="eyebrow">'+c.tag+'</span><h2 style="margin-top:10px">'+c.title+'</h2><p>'+c.body+'</p><div class="feedback">'+c.tip+'</div></div><div class="concept-illustration">'+c.visual+'</div></div>';}
function renderTasks(){if(!$('taskList'))return;$('taskList').innerHTML=C.tasks.map((t,i)=>'<div class="task '+(s.achievements[t.id]?'done':'')+'"><div class="task-top"><span class="task-state">'+(s.achievements[t.id]?'✓':'○')+'</span><div><p><b>'+(i+1)+'. '+t.short+'</b></p><p>'+t.text+'</p><button data-action="hint" data-id="'+t.id+'">Gợi ý</button><div class="task-note" id="hint-'+t.id+'" hidden>'+t.hint+'</div></div></div></div>').join('');}
function renderLab(){
  const keep=$('sqlEditor')?.value||C.sqlExamples[0].sql;
  $('panel-lab').innerHTML=head('03 / Làm việc với CSDL','Phòng thực hành mymusic','Dữ liệu thay đổi thật trong mô phỏng. Nhấn đúp một dòng hoặc chọn “Sửa” để chỉnh sửa.')+'<div class="lab-layout"><aside class="tasks"><div class="eyebrow">Hồ sơ nhiệm vụ</div><h3 style="margin-top:6px">Làm đến đâu, ghi nhận đến đó</h3><p class="subtitle muted">Hoàn thành bằng thao tác thực tế. Dấu ✓ được giữ sau khi hoàn thành.</p><div id="taskList"></div></aside><div class="workspace"><div class="card" style="padding:20px"><div class="workspace-bar"><label for="tableSelect" style="margin:0">Bảng</label><select id="tableSelect" aria-label="Chọn bảng">'+Object.entries(C.schemas).map(([t,x])=>'<option value="'+t+'" '+(table===t?'selected':'')+'>'+t+' — '+x.label+'</option>').join('')+'</select><button class="small" data-action="resetData">Khôi phục dữ liệu</button></div><div id="schemaInfo" class="subtitle muted"></div><div class="toolbar"><button class="primary" data-action="add">＋ Thêm dòng</button><button class="danger" data-action="delete">Xóa đã chọn</button><input id="filterInput" type="search" value="'+esc(filter)+'" placeholder="Lọc theo tên…" aria-label="Lọc theo tên"><button data-action="clearFilter">Bỏ lọc</button></div><div id="labFeedback" role="status" aria-live="polite"></div><div id="dataTable"></div><div id="editBox"></div>'+(C.lesson===22?'<div class="challenge"><b>Thử thách khóa ngoại</b><p class="subtitle" style="margin:6px 0 10px">Dự đoán trước khi thử: thêm bản nhạc với <code>idNhacsi = 999</code> có được chấp nhận không?</p><button class="small" data-action="invalidFK">Thử mã nhạc sĩ 999</button></div>':'')+'<div class="note">'+C.schemas[table].note+'</div></div><div class="sql-box"><div class="sql-head"><h3>⌘ Góc truy vấn SQL</h3><span style="font-size:.7rem;opacity:.8">SELECT / WHERE / ORDER BY</span></div><div class="sql-content"><p class="subtitle muted">Chọn mẫu rồi sửa hoặc tự viết. Kết quả dùng chính dữ liệu hiện tại ở các bảng phía trên.</p><div class="sql-examples">'+C.sqlExamples.map((x,i)=>'<button data-action="example" data-index="'+i+'">'+x.label+'</button>').join('')+'</div><label for="sqlEditor">Câu truy vấn</label><textarea class="sql-editor" id="sqlEditor" spellcheck="false">'+esc(keep)+'</textarea><div class="toolbar"><button class="primary" data-action="runSQL">▶ Chạy truy vấn</button><span class="subtitle muted"><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span></span></div><div id="sqlFeedback" role="status" aria-live="polite"></div><div id="queryResult"></div><details><summary>Cú pháp hỗ trợ & cách đọc kết quả</summary><p><code>SELECT * | tên_trường, ... FROM tên_bảng [WHERE điều_kiện] [ORDER BY tên_trường ASC|DESC, ...];</code></p><p>Hỗ trợ <code>=</code>, <code>LIKE</code>, <code>AND</code>, <code>OR</code> và ngoặc đơn. Với LIKE: <code>%</code> là chuỗi 0 hoặc nhiều kí tự; <code>_</code> là đúng 1 kí tự. AND được xét trước OR. Dấu [ ] trong mẫu diễn đạt phần tùy chọn; không gõ [ ] vào SQL.</p><p>Chuỗi đặt trong nháy đơn, ví dụ <code>LIKE \'P%\'</code> (bắt đầu bằng P), <code>LIKE \'%P%\'</code> (chứa P). Mô phỏng không phân biệt hoa/thường, có phân biệt dấu tiếng Việt; cách so sánh trên MySQL thật phụ thuộc collation. ASC mặc định là tăng dần; DESC là giảm dần.</p><p>Chỉ chạy một SELECT; chưa hỗ trợ JOIN, LIMIT, hàm tổng hợp hoặc lệnh INSERT/UPDATE/DELETE. Các lệnh chưa hỗ trợ sẽ báo lỗi. Sắp xếp chuỗi dùng thứ tự tiếng Việt của trình duyệt.</p></details></div></div></div></div>';
  renderTasks();renderTable();renderForm();if(sqlResult||sqlError)renderSQLResult();
}
function renderTable(){
  const sc=C.schemas[table];$('schemaInfo').innerHTML='<span class="key">◆</span> '+sc.key+' (khóa chính, INT AUTO_INCREMENT)'+Object.entries(sc.foreign||{}).map(([f,fk])=>' · <span class="fk">↗</span> '+f+' → '+fk.table+'.'+fk.key).join('');
  let rows=db.data[table].filter(r=>norm(r[sc.name]).includes(norm(filter)));
  rows=[...rows].sort((a,b)=>{const cmp=typeof a[sort.f]==='number'?a[sort.f]-b[sort.f]:String(a[sort.f]).localeCompare(String(b[sort.f]),'vi');return sort.dir==='ASC'?cmp:-cmp;});
  $('dataTable').innerHTML='<div class="table-shell"><table><thead><tr><th><input type="checkbox" id="selectAll" aria-label="Chọn tất cả dòng đang hiển thị" '+(rows.length&&rows.every(r=>selected.has(r[sc.key]))?'checked':'')+'></th>'+sc.fields.map(f=>'<th><button data-action="sort" data-field="'+f+'">'+(f===sc.key?'<span class="key">◆</span> ':sc.foreign?.[f]?'<span class="fk">↗</span> ':'')+f+' '+(sort.f===f?(sort.dir==='ASC'?'↑':'↓'):'↕')+'</button></th>').join('')+'<th>Thao tác</th></tr></thead><tbody>'+rows.map(r=>'<tr data-row-id="'+r[sc.key]+'" class="'+(selected.has(r[sc.key])?'row-selected':'')+'"><td><input type="checkbox" data-select="'+r[sc.key]+'" aria-label="Chọn dòng '+r[sc.key]+'" '+(selected.has(r[sc.key])?'checked':'')+'></td>'+sc.fields.map(f=>{const fk=sc.foreign?.[f];const ref=fk?db.data[fk.table].find(x=>x[fk.key]===r[f]):null;return '<td>'+esc(r[f])+(ref?'<small>'+esc(ref[C.schemas[fk.table].name])+'</small>':'')+'</td>';}).join('')+'<td><button class="small" data-action="edit" data-id="'+r[sc.key]+'">Sửa</button></td></tr>').join('')+(!rows.length?'<tr><td class="empty" colspan="'+(sc.fields.length+2)+'">Không có dòng phù hợp. Thử bỏ lọc hoặc thêm dữ liệu.</td></tr>':'')+'</tbody></table></div><div class="table-foot"><span>'+rows.length+' / '+db.data[table].length+' dòng · '+selected.size+' đã chọn</span><span>Nhấp tên cột để đổi thứ tự ↑ / ↓</span></div>';
}
function renderForm(){
  if(editing===null){$('editBox').innerHTML='';return;}
  const sc=C.schemas[table],row=editing==='new'?{}:db.data[table].find(r=>r[sc.key]===editing);
  $('editBox').innerHTML='<form id="rowForm" class="formbox"><h4>'+(editing==='new'?'Thêm dòng mới vào '+table:'Sửa dòng #'+editing+' của '+table)+'</h4><p class="subtitle muted">'+sc.key+': '+(editing==='new'?'tự tăng sau khi lưu':editing)+' · '+(editing==='new'?'Không cần nhập khóa chính.':'Khóa chính được giữ nguyên trong mô phỏng.')+'</p><div class="form-fields">'+sc.fields.filter(f=>f!==sc.key).map(f=>{const fk=sc.foreign?.[f];return '<div class="field"><label for="field-'+f+'">'+f+(fk?' · khóa ngoại':'')+'</label>'+(fk?'<select id="field-'+f+'" name="'+f+'" required><option value="">— Chọn từ bảng '+fk.table+' —</option>'+db.data[fk.table].map(r=>'<option value="'+r[fk.key]+'" '+(row[f]===r[fk.key]?'selected':'')+'>'+r[fk.key]+' · '+esc(r[C.schemas[fk.table].name])+'</option>').join('')+'</select>':'<input id="field-'+f+'" name="'+f+'" type="text" required maxlength="100" autocomplete="off" value="'+esc(row[f]||'')+'">')+'</div>';}).join('')+'</div><div class="form-actions"><button class="primary" type="submit">Lưu dữ liệu</button><button type="button" data-action="cancelEdit">Hủy</button></div></form>';
}
function labFeedback(message,ok){$('labFeedback').className='feedback '+(ok?'success':'error');$('labFeedback').textContent=message;}
function staleSQL(){if(sqlResult){$('queryResult').innerHTML='<div class="note">Dữ liệu đã thay đổi. Chạy lại SQL để cập nhật kết quả.</div>';sqlResult=null;}}
function recordMutation(kind,t,row,old){
  log(kind,t+' #'+row[C.schemas[t].key]);
  if(C.lesson===21){
    if(kind==='insert'&&t==='nhacsi'&&norm(row.tenNhacsi)==='trịnh công sơn')mark('add');
    if(kind==='update'&&t==='nhacsi'&&row.idNhacsi===3&&row.tenNhacsi==='Hoàng Việt')mark('edit');
    if(kind==='insert'&&t==='nhacsi'&&norm(row.tenNhacsi)==='nhạc sĩ thử'){s.tempIds.push(row.idNhacsi);save();}
    if(kind==='delete'&&t==='nhacsi'&&s.tempIds.includes(row.idNhacsi))mark('delete');
  }else{
    if(kind==='insert'&&t==='bannhac'&&norm(row.tenBannhac)==='du kích sông thao'&&row.idNhacsi===1)mark('add');
    if(kind==='update'&&t==='bannhac'&&row.idBannhac===2&&row.idNhacsi===2)mark('edit');
    if(kind==='insert'&&t==='banthuam'&&row.idBannhac&&row.idCasi)mark('recording');
  }
}
function renderSQLResult(){
  const msg=$('sqlFeedback');if(sqlError){msg.className='feedback error';msg.textContent=sqlError;$('queryResult').innerHTML='';return;}
  if(!sqlResult)return;msg.className='feedback success';msg.textContent='Truy vấn thành công: '+sqlResult.rows.length+' dòng. SELECT chỉ đọc dữ liệu, không thay đổi bảng.';
  $('queryResult').innerHTML='<div class="result-label">KẾT QUẢ / '+esc(sqlResult.table)+'</div><div class="table-shell"><table><thead><tr>'+sqlResult.columns.map(f=>'<th>'+esc(f)+'</th>').join('')+'</tr></thead><tbody>'+sqlResult.rows.map(r=>'<tr>'+sqlResult.columns.map(f=>'<td>'+esc(r[f])+'</td>').join('')+'</tr>').join('')+(!sqlResult.rows.length?'<tr><td colspan="'+sqlResult.columns.length+'" class="empty">0 dòng thỏa điều kiện.</td></tr>':'')+'</tbody></table></div>';
}
function runSQL(){
  const sql=$('sqlEditor').value;
  try{sqlResult=db.query(sql);sqlError='';s.queries.push({sql,rows:sqlResult.rows.length,time:new Date().toISOString()});s.queries=s.queries.slice(-30);save();
    if(C.lesson===21&&sqlResult.table==='nhacsi'&&sqlResult.where?.op==='LIKE'&&sqlResult.where.f==='tenNhacsi'&&norm(sqlResult.where.value)==='p%'&&sqlResult.order[0]?.f==='tenNhacsi'&&sqlResult.order[0]?.dir==='ASC'&&['idNhacsi','tenNhacsi'].every(f=>sqlResult.columns.includes(f)))mark('sql');
    if(C.lesson===22&&sqlResult.table==='bannhac'&&sqlResult.where?.op==='='&&sqlResult.where.f==='idNhacsi'&&Number(sqlResult.where.value)===2&&sqlResult.rows.length>0&&sqlResult.columns.includes('tenBannhac'))mark('sql');
  }catch(e){sqlResult=null;sqlError=e.message;}renderSQLResult();
}
function renderQuiz(){
  $('panel-quiz').innerHTML=head('04 / Tự kiểm tra','Luyện tập củng cố','8 câu hỏi · Mỗi câu một lựa chọn · Chấm trên thang 10 sau khi nộp.')+'<div class="quiz-grid">'+C.quiz.map((q,i)=>'<article class="card question"><div class="eyebrow">Câu '+(i+1)+' / 08</div><h3 style="margin-top:10px">'+q.q+'</h3>'+q.options.map((a,j)=>'<label class="'+(s.quizSubmitted?(j===q.answer?'correct':Number(s.answers[i])===j?'wrong':''):'')+'"><input type="radio" name="q'+i+'" data-quiz="'+i+'" value="'+j+'" '+(s.answers[i]!==undefined&&Number(s.answers[i])===j?'checked':'')+' '+(s.quizSubmitted?'disabled':'')+'><span>'+a+'</span></label>').join('')+(s.quizSubmitted?'<p class="answer-explain"><b>Giải thích:</b> '+q.explain+'</p>':'')+'</article>').join('')+'</div><div class="quiz-bottom"><button class="primary" data-action="submitQuiz" '+(s.quizSubmitted?'disabled':'')+'>Nộp bài & xem giải thích</button><button data-action="retryQuiz">Làm lại luyện tập</button><span id="quizScore" class="quiz-score">'+(s.quizSubmitted?quizScore()+'/10 · '+quizCorrect()+'/8 câu đúng':'')+'</span></div><div id="quizFeedback" role="status"></div>';
}
function quizCorrect(){return C.quiz.filter((q,i)=>s.answers[i]!==undefined&&Number(s.answers[i])===q.answer).length;}
function quizScore(){return (quizCorrect()*10/C.quiz.length).toLocaleString('vi-VN',{maximumFractionDigits:2});}
function renderTransfer(){
  $('panel-transfer').innerHTML=head('05 / Kết nối thực tế','Vận dụng & phiếu kết quả',C.transfer.description)+'<div class="transfer-grid"><div class="card"><span class="eyebrow">Tình huống địa phương</span><h3 style="margin-top:12px">'+C.transfer.title+'</h3>'+C.transfer.body+'<div class="transfer-check">'+C.transfer.options.map((o,i)=>'<button data-action="transfer" data-index="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div id="transferFeedback" role="status"></div><label for="reflection" style="margin-top:22px">Giải thích bằng lời của em</label><textarea id="reflection" class="response" maxlength="2000" placeholder="Nêu cách làm, lí do và điều cần kiểm tra…">'+esc(s.reflection)+'</textarea><button class="small" style="margin-top:10px" data-action="saveReflection">Lưu phần giải thích</button><p class="subtitle muted" style="margin-top:10px">Phần tự luận để giáo viên nhận xét, không chấm tự động.</p></div><div class="card tint"><span class="eyebrow">Thực hành mở rộng</span><h3 style="margin-top:12px">'+C.extension.title+'</h3><ol class="teacher">'+C.extension.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol><div class="note" style="background:#ffffff88">'+C.extension.note+'</div><details><summary>Gợi ý kết quả</summary><p>'+C.extension.answer+'</p></details></div></div><div class="card report"><div class="card-title"><h3>Phiếu kết quả học tập</h3><span class="pill">Bài '+C.lesson+'</span></div><div class="report-grid"><div class="field"><label for="studentName">Họ và tên</label><input id="studentName" type="text" maxlength="80" value="'+esc(s.name)+'" placeholder="Nhập họ tên học sinh"></div><div class="field"><label for="studentClass">Lớp / nhóm</label><input id="studentClass" type="text" maxlength="40" value="'+esc(s.className)+'" placeholder="Ví dụ: 11A4 / Nhóm 2"></div><button class="primary" data-action="printReport">In / lưu phiếu PDF</button></div><div id="reportStats"></div><div class="toolbar"><button data-action="exportReport">Tải kết quả JSON</button><button class="danger" data-action="resetAll">Làm lại toàn bộ</button></div><p class="subtitle muted">Điểm và nhiệm vụ phục vụ tự học. Phiếu ghi rõ thao tác đã hoàn thành và phần tự luận để giáo viên kiểm tra.</p></div>';
  showTransfer();renderReport();
}
function showTransfer(){if(s.transfer===null)return;const ok=s.transfer===C.transfer.answer;$('transferFeedback').className='feedback '+(ok?'success':'error');$('transferFeedback').innerHTML='<b>'+(ok?'Đúng hướng.':'Hãy xem lại mối liên hệ dữ liệu.')+'</b> '+C.transfer.explain;}
function renderReport(){if(!$('reportStats'))return;$('reportStats').innerHTML='<div class="stat-row"><div class="stat"><strong>'+Object.keys(s.achievements).filter(id=>C.tasks.some(t=>t.id===id)).length+'/'+C.tasks.length+'</strong><span>Nhiệm vụ đã hoàn thành</span></div><div class="stat"><strong>'+(s.quizSubmitted?quizScore()+'/10':'Chưa nộp')+'</strong><span>Điểm luyện tập</span></div><div class="stat"><strong>'+s.queries.length+'</strong><span>Truy vấn chạy thành công</span></div><div class="stat"><strong>'+percent()+'%</strong><span>Tiến độ hoạt động</span></div></div>';}
function reportObject(){return {bai:C.lesson,tenBai:C.title,hoTen:s.name,lop:s.className,thoiDiem:new Date().toISOString(),tienDo:percent(),nhiemVu:C.tasks.map(t=>({ten:t.short,hoanThanh:!!s.achievements[t.id],thoiDiem:s.achievements[t.id]||null})),luyenTap:s.quizSubmitted?{soCauDung:quizCorrect(),tongSoCau:C.quiz.length,diem:quizCorrect()*10/C.quiz.length,dapAnDaChon:s.answers}:null,khoiDong:s.starter,vanDung:s.transfer,giaiThich:s.reflection,truyVan:s.queries,nhatKy:s.actions,duLieuHienTai:db.data};}
function printReport(){
  const r=reportObject();$('printReport').innerHTML='<h1>PHIẾU KẾT QUẢ HỌC TẬP</h1><h2>Bài '+C.lesson+': '+C.title+'</h2><p><b>Họ tên:</b> '+esc(s.name||'..................................')+' &nbsp; <b>Lớp/nhóm:</b> '+esc(s.className||'................')+'</p><p><b>Thời gian:</b> '+new Date().toLocaleString('vi-VN')+' · <b>Tiến độ:</b> '+percent()+'% · <b>Luyện tập:</b> '+(s.quizSubmitted?quizScore()+'/10 ('+quizCorrect()+'/8 câu đúng)':'Chưa nộp')+'</p><h2>Nhiệm vụ thực hành</h2><table><thead><tr><th>Nhiệm vụ</th><th>Kết quả</th></tr></thead><tbody>'+r.nhiemVu.map(t=>'<tr><td>'+esc(t.ten)+'</td><td>'+(t.hoanThanh?'Hoàn thành':'Chưa hoàn thành')+'</td></tr>').join('')+'</tbody></table><h2>Khởi động & vận dụng</h2><p>Khởi động: '+(s.starter===null?'Chưa làm':s.starter===C.starter.answer?'Đúng':'Cần xem lại')+' · Vận dụng: '+(s.transfer===null?'Chưa làm':s.transfer===C.transfer.answer?'Đúng':'Cần xem lại')+'</p><h2>Phần giải thích của học sinh</h2><p style="white-space:pre-wrap">'+esc(s.reflection||'Chưa có nội dung.')+'</p><h2>Truy vấn gần nhất</h2><p style="white-space:pre-wrap;font-family:monospace">'+esc(s.queries.at(-1)?.sql||'Chưa chạy truy vấn thành công.')+'</p><h2>Nhận xét của giáo viên</h2><p>...............................................................................................................................</p><p>...............................................................................................................................</p><p>Học liệu tương tác Tin học 11 · Dựa trên Bài '+C.lesson+' từ các trang SGK được cung cấp. Kết quả tự học trên trình duyệt.</p>';window.print();
}
let modalAction=null;
function confirmAction(title,body,action){$('dialogTitle').textContent=title;$('dialogText').textContent=body;modalAction=action;$('confirmDialog').showModal();$('dialogCancel').focus();}
const actions={
  go:b=>switchTab(b.dataset.tab),
  starter:b=>{s.starter=Number(b.dataset.index);save();showStarter();renderProgress();},
  concept:b=>{s.concept=Number(b.dataset.index);save();renderExplore();},
  hint:b=>{const h=$('hint-'+b.dataset.id);h.hidden=!h.hidden;b.textContent=h.hidden?'Gợi ý':'Ẩn gợi ý';},
  add:()=>{editing='new';renderForm();$('rowForm').querySelector('input,select')?.focus();},
  edit:b=>{editing=Number(b.dataset.id);renderForm();$('rowForm').querySelector('input,select')?.focus();},
  cancelEdit:()=>{editing=null;renderForm();},
  delete:()=>{
    if(!selected.size){labFeedback('Hãy tích chọn ít nhất một dòng trước khi xóa.',false);return;}
    confirmAction('Xóa '+selected.size+' dòng của bảng '+table+'?','Chỉ những dòng đã chọn sẽ bị xóa. Mô phỏng kiểm tra khóa ngoại trước khi thực hiện.',()=>{
      try{const deleted=db.remove(table,[...selected]);deleted.forEach(r=>recordMutation('delete',table,r));selected.clear();editing=null;save();renderTable();renderForm();staleSQL();labFeedback('Đã xóa '+deleted.length+' dòng. Nếu đang lọc, số dòng còn lại được cập nhật.',true);}
      catch(e){log('blocked-delete',e.message);if(C.lesson===22&&table==='nhacsi'&&selected.has(2))mark('protect');labFeedback(e.message,false);}
    });
  },
  clearFilter:()=>{filter='';selected.clear();$('filterInput').value='';renderTable();},
  sort:b=>{const f=b.dataset.field;sort={f,dir:sort.f===f&&sort.dir==='ASC'?'DESC':'ASC'};if(C.lesson===21&&table==='nhacsi'&&f==='idNhacsi'&&sort.dir==='DESC')mark('sort');renderTable();},
  invalidFK:()=>{try{db.insert('bannhac',{tenBannhac:'Bản nhạc kiểm tra',idNhacsi:999});}catch(e){mark('invalid');log('blocked-insert',e.message);labFeedback(e.message+' Không có dòng mới được ghi.',false);}},
  example:b=>{$('sqlEditor').value=C.sqlExamples[Number(b.dataset.index)].sql;$('sqlEditor').focus();},
  runSQL,
  submitQuiz:()=>{const count=C.quiz.filter((q,i)=>s.answers[i]!==undefined).length;if(count<C.quiz.length){$('quizFeedback').className='feedback error';$('quizFeedback').textContent='Em đã chọn '+count+'/8 câu. Hãy trả lời đủ trước khi nộp.';return;}s.quizSubmitted=true;save();renderQuiz();renderProgress();toast('Kết quả luyện tập: '+quizScore()+'/10');},
  retryQuiz:()=>{confirmAction('Làm lại phần luyện tập?','Điểm và lựa chọn của 8 câu sẽ được xóa; nhiệm vụ thực hành được giữ.',()=>{s.answers={};s.quizSubmitted=false;save();renderQuiz();renderProgress();});},
  transfer:b=>{s.transfer=Number(b.dataset.index);save();showTransfer();renderProgress();renderReport();},
  saveReflection:()=>{s.reflection=$('reflection').value;save();toast('Đã ghi nhận phần giải thích.');},
  printReport,
  exportReport:()=>{const blob=new Blob([JSON.stringify(reportObject(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ket_qua_Bai_'+C.lesson+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
  resetData:()=>confirmAction('Khôi phục dữ liệu mẫu?','Các bảng trở về dữ liệu ban đầu. Nhiệm vụ, điểm và phần giải thích được giữ. Dùng “Làm lại toàn bộ” để bắt đầu lượt học mới.',()=>{db=LessonEngine.makeDB(C.schemas,C.initial);selected.clear();editing=null;filter='';sort={f:C.schemas[table].key,dir:'ASC'};sqlResult=null;sqlError='';save();renderLab();toast('Đã khôi phục dữ liệu mẫu.');}),
  resetAll:()=>confirmAction('Bắt đầu lại toàn bộ bài '+C.lesson+'?','Xóa dữ liệu thực hành, nhiệm vụ, điểm, họ tên và giải thích đã lưu của riêng bài này trên trình duyệt.',()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();}),
  fullscreen:()=>{if(document.fullscreenElement){document.exitFullscreen?.();}else document.documentElement.requestFullscreen?.().catch(()=>toast('Trình duyệt chưa cho phép toàn màn hình.'));}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&actions[b.dataset.action])actions[b.dataset.action](b);});
document.addEventListener('dblclick',e=>{const row=e.target.closest('[data-row-id]');if(row&&!e.target.closest('input,button'))actions.edit({dataset:{id:row.dataset.rowId}});});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='tableSelect'){table=el.value;filter='';selected.clear();editing=null;sort={f:C.schemas[table].key,dir:'ASC'};renderLab();}
  if(el.dataset.select){const id=Number(el.dataset.select);el.checked?selected.add(id):selected.delete(id);renderTable();}
  if(el.id==='selectAll'){const sc=C.schemas[table];db.data[table].filter(r=>norm(r[sc.name]).includes(norm(filter))).forEach(r=>el.checked?selected.add(r[sc.key]):selected.delete(r[sc.key]));renderTable();}
  if(el.dataset.quiz!==undefined){s.answers[el.dataset.quiz]=Number(el.value);save();}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='filterInput'){filter=el.value;selected.clear();renderTable();if(C.lesson===21&&table==='nhacsi'&&norm(filter)==='p')mark('filter');}
  if(el.id==='studentName'){s.name=el.value;save();}
  if(el.id==='studentClass'){s.className=el.value;save();}
  if(el.id==='reflection'){s.reflection=el.value;save();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='rowForm')return;e.preventDefault();
  const values=Object.fromEntries(new FormData(e.target));
  try{const kind=editing==='new'?'insert':'update',row=kind==='insert'?db.insert(table,values):db.update(table,editing,values);recordMutation(kind,table,row);save();editing=null;renderForm();renderTable();staleSQL();labFeedback('Đã '+(kind==='insert'?'thêm':'cập nhật')+' dòng #'+row[C.schemas[table].key]+'.',true);}
  catch(err){labFeedback(err.message,false);}
});
document.addEventListener('keydown',e=>{if(e.target.id==='sqlEditor'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runSQL();}if(e.target.closest('[role="tablist"]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let i=tabs.findIndex(t=>t[0]===activeTab);i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;switchTab(tabs[i][0]);$('tab-'+tabs[i][0]).focus();}});
$('dialogCancel').addEventListener('click',()=>{$('confirmDialog').close();modalAction=null;});
$('dialogConfirm').addEventListener('click',()=>{const fn=modalAction;modalAction=null;$('confirmDialog').close();fn?.();});
$('confirmDialog').addEventListener('cancel',()=>{modalAction=null;});
function init(){
  document.title='Bài '+C.lesson+' — '+C.title;
  document.documentElement.style.setProperty('--accent',C.colors.accent);document.documentElement.style.setProperty('--accent2',C.colors.accent2);document.documentElement.style.setProperty('--pale',C.colors.pale);document.documentElement.style.setProperty('--ink',C.colors.ink);
  $('lessonKicker').textContent='Chủ đề F / Tin học 11 / Bài '+C.lesson;
  $('lessonTitle').textContent=C.title;$('heroDescription').textContent=C.description;$('heroVisual').innerHTML=C.heroVisual;
  $('lessonMeta').innerHTML='<span>02 tiết thực hành</span><span>'+C.meta+'</span><span>Có chấm điểm & giải thích</span>';
  $('nav').innerHTML=tabs.map(([id,label],i)=>'<button id="tab-'+id+'" role="tab" aria-controls="panel-'+id+'" aria-selected="false" data-action="go" data-tab="'+id+'"><span class="num">0'+(i+1)+'</span>'+label+'</button>').join('')+'<span class="progress" id="progressText"></span>';
  renderStart();renderExplore();renderLab();renderQuiz();renderTransfer();renderProgress();
  const hash=location.hash.slice(1);switchTab(tabs.some(t=>t[0]===hash)?hash:'start');
  $('footerInfo').textContent='Bài '+C.lesson+' · Tin học 11 · Nội dung theo ảnh SGK trang '+C.pages+' · Mô phỏng ngoại tuyến';
  $('nextLesson').href=C.otherFile;$('nextLesson').textContent='Mở Bài '+C.otherLesson+' →';if(!canSave)$('saveWarning').hidden=false;
}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(tabs.some(t=>t[0]===id)&&id!==activeTab)switchTab(id);});
init();
</script></body></html>
