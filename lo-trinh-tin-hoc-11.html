<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lộ Trình Tin Học 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #EFF1EC;
    --surface: #FFFFFF;
    --surface-2: #F6F7F1;
    --ink: #232823;
    --ink-muted: #5B6259;
    --ink-faint: #8B9186;
    --rule: #DEE2D5;
    --border: #D6DACC;
    --on-accent: #FFFFFF;

    --accent-1: #34618F;
    --accent-2: #B5762A;
    --accent-exam: #A33B3B;

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

    --shadow: 0 10px 30px -14px rgba(35, 40, 35, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D18;
      --surface: #232620;
      --surface-2: #292C24;
      --ink: #ECEEE5;
      --ink-muted: #ABB2A0;
      --ink-faint: #767C6B;
      --rule: #363A30;
      --border: #383C31;
      --on-accent: #15160F;

      --accent-1: #82B2E1;
      --accent-2: #E3A868;
      --accent-exam: #E38080;

      --shadow: 0 10px 30px -14px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B1D18;
    --surface: #232620;
    --surface-2: #292C24;
    --ink: #ECEEE5;
    --ink-muted: #ABB2A0;
    --ink-faint: #767C6B;
    --rule: #363A30;
    --border: #383C31;
    --on-accent: #15160F;

    --accent-1: #82B2E1;
    --accent-2: #E3A868;
    --accent-exam: #E38080;

    --shadow: 0 10px 30px -14px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1360px;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3rem) clamp(1.25rem, 4vw, 2rem) 4rem;
  }

  .masthead { max-width: 720px; margin-bottom: 1.75rem; }

  .masthead-eyebrow {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    margin-bottom: 0.85rem;
  }

  .masthead-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 4.6vw, 2.85rem);
    line-height: 1.05;
    margin: 0 0 0.6rem;
    text-wrap: balance;
  }

  .masthead-sub {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink-muted);
    margin: 0;
    max-width: 62ch;
  }

  .exam-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-bottom: 1.25rem;
  }

  .exam-pill {
    appearance: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.95rem;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent-exam) 45%, var(--border));
    background: color-mix(in srgb, var(--accent-exam) 9%, var(--surface));
    color: var(--ink);
    font-family: var(--font-body);
    transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  }

  .exam-pill:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--accent-exam) 16%, var(--surface)); }
  .exam-pill:focus-visible { outline: 2px solid var(--accent-exam); outline-offset: 2px; }

  .exam-pill-kicker {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent-exam);
  }

  .exam-pill-date {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: center; }

  .legend-item { display: flex; align-items: center; gap: 0.45rem; font-size: 0.82rem; color: var(--ink-muted); }

  .legend-swatch { width: 0.65rem; height: 0.65rem; border-radius: 3px; flex: 0 0 auto; }

  .controls { display: flex; gap: 0.5rem; }

  .ctrl-btn {
    appearance: none;
    cursor: pointer;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink-muted);
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 600;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
  }

  .ctrl-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 30%, var(--border)); }
  .ctrl-btn:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

  .canvas-wrap {
    position: relative;
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: clamp(1.5rem, 3vw, 2.5rem);
  }

  .connectors { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

  .tree { position: relative; z-index: 1; width: max-content; min-width: 100%; }

  .node { display: flex; align-items: flex-start; gap: 1.85rem; position: relative; }

  .node-card {
    --accent: var(--ink-faint);
    flex: 0 0 auto;
    width: 300px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
  }

  .node-card.clickable { cursor: pointer; }
  .node-card.clickable:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .node-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .node-card.flash {
    animation: flashPulse 1.1s ease;
  }
  @keyframes flashPulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-exam) 55%, transparent); }
    100% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--accent-exam) 0%, transparent); }
  }

  .node-card-root {
    width: 260px;
    background: var(--ink);
    border-color: var(--ink);
  }
  .node-card-root .node-title { color: var(--surface); }
  .node-card-root .node-sub { color: color-mix(in srgb, var(--surface) 70%, var(--ink)); }
  .node-card-root .node-count { color: color-mix(in srgb, var(--surface) 55%, var(--ink)); }

  .node-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }

  .node-kicker {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }

  .node-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.98rem;
    line-height: 1.35;
    margin: 0;
  }

  .node-card-root .node-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }

  .node-sub {
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--ink-muted);
    margin-top: 0.35rem;
    font-variant-numeric: tabular-nums;
  }

  .node-count {
    font-size: 0.72rem;
    color: var(--ink-faint);
    margin-top: 0.3rem;
  }

  .chevron {
    flex: 0 0 auto;
    width: 1.1rem;
    height: 1.1rem;
    color: var(--accent);
    transition: transform 0.25s ease;
  }
  .node-card.open .chevron { transform: rotate(90deg); }

  .exam-badge {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    margin-top: 0.6rem;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    background: color-mix(in srgb, var(--accent-exam) 13%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent-exam) 38%, var(--border));
  }
  .exam-badge-label { font-size: 0.72rem; font-weight: 700; color: var(--accent-exam); }
  .exam-badge-date { font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  .topic-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }
  .topic-dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--accent); }

  .node-marker .node-card {
    background: transparent;
    border-style: dashed;
    padding: 0.6rem 0.9rem;
    width: 300px;
  }
  .node-marker .node-title { font-weight: 500; font-style: italic; color: var(--ink-faint); font-size: 0.86rem; }
  .node-marker .node-sub { margin-top: 0.2rem; }

  .children-grid {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.38s cubic-bezier(.4,0,.2,1);
    flex: 1 1 auto;
    min-width: 0;
  }
  .children-grid.open { grid-template-rows: 1fr; }
  .children-inner { overflow: hidden; min-height: 0; }
  .children-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 0.15rem 0.15rem 0.15rem 0;
  }

  .lesson-detail {
    width: 360px;
    margin-top: 0.65rem;
    padding-top: 0.65rem;
    border-top: 1px dashed var(--border);
  }
  .lesson-detail ul { margin: 0 0 0.55rem; padding-left: 1.1rem; }
  .lesson-detail li { font-size: 0.82rem; line-height: 1.55; color: var(--ink-muted); margin-bottom: 0.25rem; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.55rem; }
  .chip {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-faint);
  }

  .detail-label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }
  .detail-block { margin-bottom: 0.55rem; }
  .detail-block p { margin: 0; font-size: 0.82rem; line-height: 1.55; color: var(--ink-muted); }
  .detail-block:last-child { margin-bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    .children-grid, .chevron, .node-card, .exam-pill { transition: none !important; animation: none !important; }
  }

  @media (max-width: 640px) {
    .node-card, .node-marker .node-card { width: 250px; }
  }
</style>
</head>

,{"type":"lesson","id":"l-17","title":"Bài 27 Công cụ vẽ và một số ứng dụng","topic":"E","topicName":"ỨNG DỤNG TIN HỌC","date":"25-30/01/2027","tiet":"39, 40","tuan":2,"yccd":["– Biết được khái niệm lớp ảnh.","– Biết một số công cụ vẽ đơn giản.","– Thực hiện được một số ứng dụng để tẩy, làm sạch và xóa các vết xước trên ảnh."],"nls":["3.1.NC1a","5.2.NC1b"],"ai":["Nhận biết AI hỗ trợ tạo hình ảnh và thiết kế; liên hệ với các ứng dụng AI trong đồ hoạ."],"khung":["11.C2.1 - Trình bày được cách AI hỗ trợ quá trình học tập và thiết kế các công cụ hỗ trợ; Trình bày các công cụ AI mong muốn nhằm hỗ trợ hoạt động học tập."]},{"type":"marker","title":"NGHỈ TẾT","date":"01-06/02/2027","tuan":null},{"type":"marker","title":"NGHỈ TẾT","date":"08-13/02/2027","tuan":null},{"type":"lesson","id":"l-18","title":"Bài 28 Tạo ảnh động","topic":"E","topicName":"ỨNG DỤNG TIN HỌC","date":"15-20/02/2027","tiet":"41, 42","tuan":3,"yccd":["– Thực hiện được các thao tác tạo ảnh động từ mô hình lớp ảnh.","– Tạo được ảnh động từ các ảnh tĩnh với tốc độ hiển thị mặc định."],"nls":["3.1.NC1a","5.2.NC1b"],"ai":["Hiểu cách AI hỗ trợ tạo nội dung đa phương tiện; liên hệ với các ứng dụng AI trong xử lí hình ảnh và video."],"khung":["11.C3.2 - Mô tả được cách thức vận hành của một số công nghệ AI; Hiểu cách thức các công nghệ vận hành trong hệ thống AI."]},{"type":"lesson","id":"l-19","title":"Bài 29 Khám phá phần mềm làm phim","topic":"E","topicName":"ỨNG DỤNG TIN HỌC","date":"22-27/2/2027","tiet":"43, 44","tuan":4,"yccd":["Tạo được các đoạn phim, nhập tư liệu từ ảnh và video có sẵn, biên tập được đoạn phim phục vụ học tập và giải trí."],"nls":["3.1.NC1a","5.2.NC1b"],"ai":["Biết sử dụng công cụ hỗ trợ AI trong chỉnh sửa video; bước đầu đánh giá sản phẩm do AI hỗ trợ tạo ra."],"khung":["11.C2.1 - Trình bày được cách AI hỗ trợ quá trình học tập và thiết kế các công cụ hỗ trợ."]},{"type":"lesson","id":"l-20","title":"Bài 30 Biên tập phim","topic":"E","topicName":"ỨNG DỤNG TIN HỌC","date":"1-6/3/2027","tiet":"45, 46","tuan":5,"yccd":["Sử dụng được một số công cụ cơ bản biên tập phim: chỉnh sửa hình ảnh, âm thanh, tạo phụ đề, tạo các hiệu ứng chuyển cảnh, căn chỉnh thời gian."],"nls":["3.1.NC1a","5.2.NC1b"],"ai":["Nhận biết vai trò của AI trong chỉnh sửa video (tự động cắt ghép, tạo hiệu ứng, xử lí âm thanh); bước đầu sử dụng công cụ có hỗ trợ AI."],"khung":["11.C3.2 - Mô tả được cách thức vận hành của một số công nghệ AI; Hiểu cách thức các công nghệ vận hành trong hệ thống AI."]}]},{"id":"p-chk2","code":"CHK2","title":"Trước kiểm tra cuối kỳ 2","exam":{"label":"Ôn tập & Kiểm tra cuối học kỳ 2","date":"26-29/04/2027","tiet":"61, 62","tuan":13},"items":[{"type":"lesson","id":"l-21","title":"Bài 31 Thực hành tạo phim hoạt hình","topic":"E","topicName":"ỨNG DỤNG TIN HỌC","date":"15-20/03/2027","tiet":"49, 50","tuan":7,"yccd":["Tạo được đoạn phim hoạt hình từ ảnh, có hội thoại giữa các nhân vật và có phụ đề."],"nls":["3.1.NC1a","5.2.NC1b"],"ai":["Vận dụng công cụ để tạo sản phẩm đa phương tiện; liên hệ với việc sử dụng AI hỗ trợ sáng tạo nội dung."],"khung":["11.C2.1 - Trình bày được cách AI hỗ trợ quá trình học tập và thiết kế các công cụ hỗ trợ."]},{"type":"lesson","id":"l-22","title":"Bài 01 Hệ điều hành · Bài 02 Thực hành sử dụng hệ điều hành","topic":"A","topicName":"MÁY TÍNH VÀ XÃ HỘI TRI THỨC","date":"22-27/03/2027","tiet":"51, 52","tuan":8,"yccd":["– Nắm được lịch sử phát triển của các hệ điều hành thông dụng cho máy tính cá nhân, một hệ điều hành thương mại và một hệ điều hành nguồn mở.","– Hiểu được đặc điểm của hệ điều hành cho thiết bị di động.","– Hiểu được một các khái quát mối quan hệ giữa phần cứng, hệ điều hành và phần mềm ứng dụng cũng như vai trò của mỗi thành phần trong hoạt động chung của cả hệ thống.","– Sử dụng được một số chức năng cơ bản của hệ điều hành thương mại, hệ điều hành mã nguồn mở.","– Sử dụng được một số tiện ích cơ bản của hệ điều hành cho điện thoại.","– Sử dụng được một số tiện ích có sẵn của hệ điều hành để nâng cao hiệu suất sử const state = {};
const connections = [];
const wrap = document.getElementById('canvasWrap');
const svg = document.getElementById('connectors');
const treeEl = document.getElementById('tree');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderLessonDetail(lesson) {
  const wrapEl = el('div', 'lesson-detail');

  if (lesson.yccd && lesson.yccd.length) {
    const block = el('div', 'detail-block');
    block.appendChild(el('span', 'detail-label', 'Yêu cầu cần đạt'));
    const ul = el('ul');
    lesson.yccd.forEach(t => ul.appendChild(el('li', null, t.replace(/^[\u2013-]\s*/, ''))));
    block.appendChild(ul);
    wrapEl.appendChild(block);
  }

  if (lesson.nls && lesson.nls.length) {
    const block = el('div', 'detail-block');
    block.appendChild(el('span', 'detail-label', 'Năng lực số'));
    const row = el('div', 'chip-row');
    lesson.nls.forEach(code => row.appendChild(el('span', 'chip', code)));
    block.appendChild(row);
    wrapEl.appendChild(block);
  }

  if (lesson.ai && lesson.ai.length) {
    const block = el('div', 'detail-block');
    block.appendChild(el('span', 'detail-label', 'Tích hợp AI'));
    block.appendChild(el('p', null, lesson.ai.join(' ')));
    wrapEl.appendChild(block);
  }

  if (lesson.khung && lesson.khung.length) {
    const block = el('div', 'detail-block');
    block.appendChild(el('span', 'detail-label', 'Khung năng lực số 3439'));
    block.appendChild(el('p', null, lesson.khung.join(' ')));
    wrapEl.appendChild(block);
  }

  return wrapEl;
}

function makeToggleCard(id, accentVar, headContent, detailBuilder) {
  const card = el('div', 'node-card clickable');
  card.dataset.id = id;
  card.style.setProperty('--accent', accentVar);
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.appendChild(headContent);

  const grid = el('div', 'children-grid');
  const inner = el('div', 'children-inner');
  const detail = detailBuilder(card);
  inner.appendChild(detail);
  grid.appendChild(inner);

  state[id] = false;

  function apply() {
    card.classList.toggle('open', state[id]);
    grid.classList.toggle('open', state[id]);
  }
  function toggle() {
    state[id] = !state[id];
    apply();
    scheduleRedraw();
  }
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  apply();

  return { card, grid };
}

function buildLessonNode(lesson, accentVar) {
  const head = el('div');
  const kicker = el('span', 'topic-tag');
  kicker.appendChild(el('span', 'topic-dot'));
  kicker.appendChild(document.createTextNode('Chủ đề ' + lesson.topic));
  if (DATA.topics[lesson.topic]) kicker.title = DATA.topics[lesson.topic];
  head.appendChild(kicker);

  const headRow = el('div', 'node-head');
  const titleWrap = el('div');
  titleWrap.appendChild(el('p', 'node-title', lesson.title));
  const sub = el('div', 'node-sub');
  sub.textContent = (lesson.date || '') + (lesson.tiet ? '  ·  Tiết ' + lesson.tiet : '');
  titleWrap.appendChild(sub);
  headRow.appendChild(titleWrap);
  const chev = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  chev.setAttribute('class', 'chevron');
  chev.innerHTML = '<use href="#icon-chevron"></use>';
  headRow.appendChild(chev);
  head.appendChild(headRow);

  const { card, grid } = makeToggleCard(lesson.id, accentVar, head, () => renderLessonDetail(lesson));

  const row = el('div', 'node');
  row.appendChild(card);
  row.appendChild(grid);
  return row;
}

function buildMarkerNode(marker) {
  const row = el('div', 'node node-marker');
  const card = el('div', 'node-card');
  card.appendChild(el('p', 'node-title', marker.title));
  const sub = el('div', 'node-sub', marker.date || '');
  card.appendChild(sub);
  row.appendChild(card);
  return row;
}

function buildPeriodNode(period, accentVar) {
  const head = el('div');
  const kicker = el('span', 'node-kicker', period.code);
  head.appendChild(kicker);

  const headRow = el('div', 'node-head');
  const titleWrap = el('div');
  titleWrap.appendChild(el('p', 'node-title', period.title));
  const lessonCount = period.items.filter(it => it.type === 'lesson').length;
  titleWrap.appendChild(el('div', 'node-count', lessonCount + ' bài học'));
  headRow.appendChild(titleWrap);
  const chev = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  chev.setAttribute('class', 'chevron');
  chev.innerHTML = '<use href="#icon-chevron"></use>';
  headRow.appendChild(chev);
  head.appendChild(headRow);

  if (period.exam) {
    const badge = el('div', 'exam-badge');
    badge.appendChild(el('span', 'exam-badge-label', period.exam.label));
    badge.appendChild(el('span', 'exam-badge-date', period.exam.date + (period.exam.tiet ? ' · Tiết ' + period.exam.tiet : '')));
    head.appendChild(badge);
  }

  const { card, grid } = makeToggleCard(period.id, accentVar, head, (selfCard) => {
    const list = el('div', 'children-list');
    period.items.forEach(it => {
      const node = it.type === 'lesson' ? buildLessonNode(it, accentVar) : buildMarkerNode(it);
      list.appendChild(node);
      if (it.type === 'lesson') {
        connections.push({ parent: selfCard, child: node.querySelector('.node-card') });
      }
    });
    const holder = el('div');
    holder.appendChild(list);
    return holder;
  });

  const row = el('div', 'node');
  row.appendChild(card);
  row.appendChild(grid);
  return { row, card };
}

function buildTree() {
  const rootRow = el('div', 'node node-root');
  const rootCard = el('div', 'node-card node-card-root open');
  rootCard.style.setProperty('--accent', 'var(--ink-faint)');
  rootCard.appendChild(el('p', 'node-title', DATA.meta.title));
  rootCard.appendChild(el('div', 'node-sub', DATA.meta.subtitle));
  rootCard.appendChild(el('div', 'node-count', DATA.meta.span + '  ·  ' + DATA.meta.lessonCount + ' bài học'));
  rootRow.appendChild(rootCard);

  const rootGrid = el('div', 'children-grid open');
  const rootInner = el('div', 'children-inner');
  const rootList = el('div', 'children-list');

  DATA.periods.forEach((period, i) => {
    const accentVar = (period.code === 'GHK1' || period.code === 'CHK1') ? 'var(--accent-1)' : 'var(--accent-2)';
    const { row, card } = buildPeriodNode(period, accentVar);
    rootList.appendChild(row);
    connections.push({ parent: rootCard, child: card });
    if (i === 0) {
      state[period.id] = true;
      card.classList.add('open');
      row.querySelector('.children-grid').classList.add('open');
    }
  });

  rootInner.appendChild(rootList);
  rootGrid.appendChild(rootInner);
  rootRow.appendChild(rootGrid);
  treeEl.appendChild(rootRow);
}

function buildExamStrip() {
  const stripEl = document.getElementById('examStrip');
  DATA.periods.forEach(period => {
    if (!period.exam) return;
    const btn = el('button', 'exam-pill');
    btn.type = 'button';
    btn.appendChild(el('span', 'exam-pill-kicker', period.code));
    btn.appendChild(el('span', 'exam-pill-date', period.exam.date));
    btn.addEventListener('click', () => jumpTo(period.id));
    stripEl.appendChild(btn);
  });
}

function jumpTo(nodeId) {
  const card = document.querySelector('[data-id="' + nodeId + '"]');
  if (!card) return;
  if (!state[nodeId]) {
    state[nodeId] = true;
    card.classList.add('open');
    card.parentElement.querySelector('.children-grid').classList.add('open');
    scheduleRedraw(500);
  }
  card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1200);
}

function pathFor(sx, sy, ex, ey) {
  const mx = (sx + ex) / 2;
  return 'M ' + sx + ',' + sy + ' C ' + mx + ',' + sy + ' ' + mx + ',' + ey + ' ' + ex + ',' + ey;
}

function drawConnectors() {
  const wrapRect = wrap.getBoundingClientRect();
  const scrollW = treeEl.scrollWidth;
  const scrollH = treeEl.scrollHeight;
  svg.setAttribute('width', scrollW);
  svg.setAttribute('height', scrollH);
  svg.setAttribute('viewBox', '0 0 ' + scrollW + ' ' + scrollH);

  let markup = '';
  connections.forEach(({ parent, child }) => {
    const pr = parent.getBoundingClientRect();
    const cr = child.getBoundingClientRect();
    if (cr.height < 2 || cr.width < 2) return;
    const sx = pr.right - wrapRect.left + wrap.scrollLeft;
    const sy = pr.top + pr.height / 2 - wrapRect.top + wrap.scrollTop;
    const ex = cr.left - wrapRect.left + wrap.scrollLeft;
    const ey = cr.top + cr.height / 2 - wrapRect.top + wrap.scrollTop;
    const color = (getComputedStyle(parent).getPropertyValue('--accent') || '').trim() || 'var(--ink-faint)';
    markup += '<path d="' + pathFor(sx, sy, ex, ey) + '" fill="none" stroke="' + color + '" stroke-width="1.75" stroke-linecap="round" opacity="0.85"></path>';
  });
  svg.innerHTML = markup;
}

let redrawRAF = null;
function scheduleRedraw(duration) {
  duration = duration || 420;
  const start = performance.now();
  if (redrawRAF) cancelAnimationFrame(redrawRAF);
  function step(t) {
    drawConnectors();
    if (t - start < duration) {
      redrawRAF = requestAnimationFrame(step);
    } else {
      redrawRAF = null;
      drawConnectors();
    }
  }
  redrawRAF = requestAnimationFrame(step);
}

document.getElementById('expandAllBtn').addEventListener('click', () => {
  Object.keys(state).forEach(id => state[id] = true);
  document.querySelectorAll('.node-card.clickable').forEach(c => c.classList.add('open'));
  document.querySelectorAll('.children-grid').forEach(g => g.classList.add('open'));
  scheduleRedraw(600);
});

document.getElementById('collapseAllBtn').addEventListener('click', () => {
  Object.keys(state).forEach(id => state[id] = false);
  document.querySelectorAll('.node-card.clickable').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.children-grid').forEach(g => g.classList.remove('open'));
  scheduleRedraw(600);
});

buildTree();
buildExamStrip();
document.getElementById('mastheadSub').textContent =
  'Sơ đồ tư duy tương tác dựng từ Ke_hoach_bai_day_Tin_hoc_11.xlsx — ' + DATA.meta.lessonCount + ' bài học, ' + DATA.meta.span + '. Bấm vào từng nhánh để mở rộng hoặc thu gọn; bấm mốc kiểm tra phía trên để nhảy tới nhánh tương ứng.';

window.addEventListener('resize', () => scheduleRedraw(200));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => scheduleRedraw(300));
}
scheduleRedraw(700);
</script>
